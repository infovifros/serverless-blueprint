# ─── Utility / documentation endpoints ────────────────────────────────────────

swagger-ui:
  handler: handlers/swagger/swagger-ui/handler.handler
  description: Serves the interactive Swagger UI.
  events:
    - httpApi:
        path: /v1/swagger
        method: get

swagger-json:
  handler: handlers/swagger/swagger-json/handler.handler
  description: Returns the raw OpenAPI 3.0 JSON specification.
  events:
    - httpApi:
        path: /v1/swagger.json
        method: get
